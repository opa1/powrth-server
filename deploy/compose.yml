services:
  powrth-api:
    image: ghcr.io/${IMAGE_OWNER}/${REPO_NAME}-api:${IMAGE_TAG}
    container_name: powrth-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"   # HTTP — Caddy proxies this; never exposed publicly
      - "0.0.0.0:8765:8765"     # TCP — smart meter connections; must bind all interfaces
    env_file: .env
    networks:
      - alpha

networks:
  alpha:
    external: true
